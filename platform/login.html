<!DOCTYPE html>
<html lang="en" class="scroll-smooth" dir="ltr">
<head>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Bootcamp - Student Login</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 0: '#060814', 1: '#0a0f1c', 2: '#0f1629', 3: '#141c33', 4: '#1a2440' },
            accent: { blue: '#3b82f6', orange: '#f97316', cyan: '#22d3ee', green: '#34d399' },
            ink: { 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b' }
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'Tajawal', 'sans-serif'],
            body: ['Tajawal', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="platform-theme.css">
</head>
<body class="bg-surface-0 text-ink-200 min-h-screen overflow-hidden grid-pattern">
  <!-- Grid glow canvas injected by cursor-follower.js -->
  
  <!-- Animated orbs -->
  <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-accent-blue/10 rounded-full blur-3xl float"></div>
  <div class="fixed bottom-1/4 right-1/4 w-80 h-80 bg-accent-orange/10 rounded-full blur-3xl float" style="animation-delay: -3s;"></div>

  <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-accent-blue to-accent-orange mb-4 glow">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-ink-100 font-display">Python Bootcamp</h1>
        <p class="text-sm text-ink-500 mt-1 font-mono text-xs tracking-wider">STUDENT PLATFORM</p>
        <img src="assets/images/logo-association.png" alt="الجمعية الصناعية" class="h-20 w-auto mx-auto mt-4" style="background: #ffffff; border: 1px solid var(--border-main); border-radius: 10px; padding: 5px;" onerror="this.style.display='none'">
      </div>

      <!-- Login Card -->
      <div class="glass rounded-3xl p-8 glow">
        <div class="text-center mb-6">
          <h2 class="text-xl font-bold text-ink-100">Welcome Back</h2>
          <p class="text-sm text-ink-400 mt-1">Sign in to access your course</p>
        </div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-ink-400 uppercase tracking-wider mb-2">Email Address</label>
            <input 
              type="email" 
              id="emailInput"
              placeholder="student@example.com"
              class="w-full px-4 py-3 rounded-xl bg-surface-2 border border-ink-800 text-ink-100 placeholder-ink-600 font-medium transition-all focus:border-accent-blue"
              required
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-ink-400 uppercase tracking-wider mb-2">Password</label>
            <input 
              type="password" 
              id="passwordInput"
              placeholder="Enter your password"
              class="w-full px-4 py-3 rounded-xl bg-surface-2 border border-ink-800 text-ink-100 placeholder-ink-600 font-medium transition-all focus:border-accent-blue"
              required
            >
          </div>

          <div id="nameField" class="hidden">
            <label class="block text-xs font-bold text-ink-400 uppercase tracking-wider mb-2">Full Name</label>
            <input 
              type="text" 
              id="nameInput"
              placeholder="Your name"
              class="w-full px-4 py-3 rounded-xl bg-surface-2 border border-ink-800 text-ink-100 placeholder-ink-600 font-medium transition-all focus:border-accent-blue"
            >
          </div>

          <button 
            type="submit"
            class="w-full py-3.5 rounded-xl font-bold bg-gradient-to-r from-accent-blue to-blue-600 text-white hover:shadow-lg hover:shadow-accent-blue/20 transition-all btn-press flex items-center justify-center gap-2"
          >
            <span>Access Platform</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </button>
        </form>

        <div id="errorMessage" class="hidden mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center"></div>
      </div>

      <!-- Footer -->
      <p class="text-center text-xs text-ink-600 mt-6">
        Don't have access? Contact your instructor.
      </p>

      <!-- Sponsor Logos -->
      <div class="flex items-center justify-center gap-5 mt-6 pt-5 border-t border-ink-800/50">
        <img src="assets/images/logo-association.png" alt="الجمعية الصناعية" class="h-20 w-auto" style="background: #ffffff; border: 1px solid var(--border-main); border-radius: 10px; padding: 5px;" onerror="this.style.display='none'">
        <div class="w-px h-10 bg-ink-800/50"></div>
        <img src="assets/images/logo-ministry.png" alt="وزارة الصناعة" class="h-20 w-auto" style="background: #ffffff; border: 1px solid var(--border-main); border-radius: 10px; padding: 5px;" onerror="this.style.display='none'">
      </div>
      <button onclick="toggleTheme()" class="mx-auto mt-4 p-2 rounded-lg bg-surface-2 border border-ink-800 text-ink-400 hover:text-ink-100 hover:border-accent-blue transition-all flex items-center gap-2" title="Toggle Theme">
        <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = 'admin@admin.com';
    const ADMIN_PASSWORD = 'admin';
    const ALLOWED_EMAILS = [];

    const currentUser = localStorage.getItem('python_bootcamp_user');
    if (currentUser) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('emailInput').addEventListener('input', function() {
      const email = this.value.toLowerCase().trim();
      const nameField = document.getElementById('nameField');
      if (email === ADMIN_EMAIL) {
        nameField.classList.add('hidden');
      } else {
        nameField.classList.remove('hidden');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('emailInput').value.toLowerCase().trim();
      const password = document.getElementById('passwordInput').value;
      const nameInput = document.getElementById('nameInput');
      const errorDiv = document.getElementById('errorMessage');
      
      errorDiv.classList.add('hidden');
      
      if (!email || !password) {
        errorDiv.textContent = 'Please fill in all fields';
        errorDiv.classList.remove('hidden');
        return;
      }

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        const userData = {
          email: email,
          name: 'Admin',
          isAdmin: true,
          loginTime: new Date().toISOString(),
          completedSessions: [],
          progress: 0
        };
        localStorage.setItem('python_bootcamp_user', JSON.stringify(userData));
        window.location.href = 'dashboard.html';
        return;
      }

      const name = nameInput.value.trim();
      if (!name) {
        errorDiv.textContent = 'Please enter your name';
        errorDiv.classList.remove('hidden');
        return;
      }

      if (ALLOWED_EMAILS.length > 0 && !ALLOWED_EMAILS.includes(email)) {
        errorDiv.textContent = 'This email is not authorized. Contact your instructor.';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      const userData = {
        email: email,
        name: name,
        isAdmin: false,
        loginTime: new Date().toISOString(),
        completedSessions: [],
        progress: 0
      };
      
      localStorage.setItem('python_bootcamp_user', JSON.stringify(userData));
      window.location.href = 'dashboard.html';
    });

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? null : 'light';
      if (next) {
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
      } else {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
      }
    }

    (function() {
      const icon = document.getElementById('themeIcon');
      if (document.documentElement.getAttribute('data-theme') === 'light' && icon) {
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
      }
    })();
  </script>
  <script src="cursor-follower.js" defer></script>
</body>
</html>
