<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide-container">
  <div class="bg-grid"></div>
  <div class="bg-glow-magenta" style="top:-180px; right:-150px;"></div>
  <div class="bg-glow-lime" style="bottom:-200px; left:-120px;"></div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:110px; width:1720px; z-index:10;">
    <div class="kicker">❓ QUICK CHECK — SCOPE</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:64px; font-weight:700; color:var(--text-hi); margin-top:16px;">What does this print?</div>
    <div class="arabic" style="font-size:30px; color:var(--text-lo); margin-top:12px; direction:rtl;">ماذا تُظهر هذه الأسطر؟ تذكّر قاعدة النطاق</div>
  </div>

  <div class="code-window" data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:330px; width:900px; height:240px; z-index:5;">
    <div class="code-window-header">
      <span class="code-dot code-dot-r"></span>
      <span class="code-dot code-dot-y"></span>
      <span class="code-dot code-dot-g"></span>
      <span class="code-window-title">q.py</span>
    </div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:110px; top:385px; width:840px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:27px; line-height:1.6;">
    <div><span class="tok-var">x</span> <span class="tok-op">=</span> <span class="tok-num">7</span></div>
    <div><span class="tok-kw">def</span> <span class="tok-fn">f</span>():</div>
    <div>&nbsp;&nbsp;&nbsp;&nbsp;<span class="tok-var">x</span> <span class="tok-op">=</span> <span class="tok-num">3</span></div>
    <div><span class="tok-fn">f</span>()</div>
    <div><span class="tok-fn">print</span>(<span class="tok-var">x</span>)</div>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:1060px; top:330px; width:760px; height:120px; background:rgba(34,211,238,0.06); border:1px solid rgba(34,211,238,0.35); border-radius:16px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1090px; top:362px; width:700px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:28px;"><span class="tok-var">A)</span> <span class="tok-num">3</span></div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:1060px; top:480px; width:760px; height:120px; background:rgba(163,230,53,0.06); border:1px solid rgba(163,230,53,0.35); border-radius:16px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1090px; top:512px; width:700px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:28px;"><span class="tok-var">B)</span> <span class="tok-num">7</span> <span class="tok-com"># global x survives</span></div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:1060px; top:630px; width:760px; height:120px; background:rgba(236,72,153,0.06); border:1px solid rgba(236,72,153,0.35); border-radius:16px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1090px; top:662px; width:700px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:28px;"><span class="tok-var">C)</span> <span class="tok-num">3</span> <span class="tok-op">then</span> <span class="tok-num">7</span></div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:1060px; top:780px; width:760px; height:120px; background:rgba(167,139,250,0.06); border:1px solid rgba(167,139,250,0.35); border-radius:16px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1090px; top:812px; width:700px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:28px;"><span class="tok-var">D)</span> <span class="tok-op">Error</span></div>

  <div class="chrome-brand">PY_BOOTCAMP // S07</div>
  <div class="chrome-pagenum">30 / 50</div>
</div>
<template data-slide-notes>
- **Answer: B — 7.** f() creates a LOCAL x=3, then discards it; global x stays 7.
- print(x) outside sees the global.
- This exact pattern is the #1 scope gotcha — students answer C or A often.
- Have them explain using the "backpack vs whiteboard" analogy.
- If time: demo `global x` version briefly, warn it's rarely needed.
- Arabic tip: الدالة أنشأت نسخة داخلية لم تلمس النسخة الخارجية.
</template>
</body>
</html>
