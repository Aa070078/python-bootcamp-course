<template data-slide-notes>
**Slide 4 — Review MCQ (indexing & slicing)**

**Answer: A — `[20, 30]`**

- `nums[1:3]` → start at index 1 (`20`), stop before index 3 (`40`). Result `[20, 30]`.
- D `[20, 30, 40]` is the common mistake (forgetting the end index is exclusive).

Visual: draw the indices under the list on the board: `10[0] 20[1] 30[2] 40[3] 50[4]`, then circle 1 and 3.

Say: "Slicing is how we'll later grab words out of a sentence — remember `start included, end excluded`."

Arabic tip: اشرح القاعدة "البداية تدخل، والنهاية لا تدخل" واطلب من طالب أن يعيدها بصوت عالٍ لتثبيتها.
