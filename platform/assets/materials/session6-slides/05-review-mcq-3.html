<template data-slide-notes>
**Slide 5 — Review MCQ (list methods)**

**Answer: A — `nums.append(99)`**

- A `append(x)` → adds `x` at the end of a list. ✅
- B `add(x)` → that's a **set** method — a teaser of today's topic!
- C `insert(99)` → `insert` needs an index first: `nums.insert(0, 99)`. This call raises an error.
- D `push(99)` → that's JavaScript — Python lists don't have it.

Say: "Notice B uses `add` — we meet that method in about 15 minutes. Keep it in mind!"

Arabic tip: ذكّر الطلاب بأن لكل نوع (list / set / dict) دوالّه الخاصة، ولا يمكن استدعاء دالة نوع على نوع آخر. هذه نقطة أخطاء شائعة عند المبتدئين.
