<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide-container">
  <div class="bg-grid"></div>
  <div class="bg-glow-cyan" style="left:-220px; top:-160px;"></div>
  <div class="bg-glow-magenta" style="right:-180px; bottom:-180px;"></div>

  <!-- HEADER -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:130px; width:1760px; z-index:10;">
    <div class="kicker">🤖 PREDICT THE OUTPUT</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:64px; font-weight:700; color:var(--text-hi); margin-top:14px;">Run it in your head first…</div>
    <div class="arabic" style="font-size:28px; color:var(--text-lo); margin-top:12px;">توقّع الناتج قبل التشغيل — لا تفتح المحرر بعد</div>
  </div>

  <!-- CODE WINDOW -->
  <div class="code-window" data-object="true" data-object-type="shape" style="position:absolute; left:400px; top:290px; width:1120px; height:480px; z-index:5;">
    <div class="code-window-header">
      <span class="code-dot code-dot-r"></span>
      <span class="code-dot code-dot-y"></span>
      <span class="code-dot code-dot-g"></span>
      <span class="code-window-title">predict.py</span>
    </div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:432px; top:352px; width:1060px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:28px; line-height:1.85;">
    <div><span class="tok-var">s</span> <span class="tok-op">=</span> {<span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>}</div>
    <div>&nbsp;</div>
    <div><span class="tok-var">s</span>.<span class="tok-fn">add</span>(<span class="tok-num">2</span>)    <span class="tok-com"># 2 is already there…</span></div>
    <div><span class="tok-var">s</span>.<span class="tok-fn">add</span>(<span class="tok-num">4</span>)    <span class="tok-com"># brand new value</span></div>
    <div>&nbsp;</div>
    <div><span class="tok-fn">print</span>(<span class="tok-fn">len</span>(<span class="tok-var">s</span>))</div>
    <div><span class="tok-out"># ?</span></div>
  </div>

  <!-- PROMPT -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:400px; top:820px; width:1120px; height:130px; background:rgba(250,204,21,0.05); border:1px solid rgba(250,204,21,0.4); border-radius:20px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:432px; top:848px; width:1060px; z-index:10;">
    <div style="font-family:'Space Grotesk',sans-serif; font-size:28px; color:var(--text-mid);">❓ <span style="color:var(--neon-yellow); font-weight:700;">Predict:</span> what prints? Then type it into IDLE and check. 🧪</div>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S06</div>
  <div class="chrome-pagenum">17 / 45</div>
</div>
<template data-slide-notes>
**Slide 17 — Predict the output**

**Answer: `4`**

Walk through it:
- `s = {1, 2, 3}` → size 3.
- `s.add(2)` → `2` already exists, **nothing changes** — size stays 3.
- `s.add(4)` → adds `4` — size 4.
- `len(s)` → `4`.

Common wrong answer: "5" (students count `add` as always growing). Emphasize: `add` on an existing value is a silent no-op.

Have them predict aloud before revealing. Then run it to confirm.

Arabic tip: اسأل: "ماذا يحدث إذا أضفنا قيمة موجودة بالفعل؟" أجب: "لا شيء — المجموعة لن تتغير." هذا هو بيت القصيد.
</template>
</body>
</html>
