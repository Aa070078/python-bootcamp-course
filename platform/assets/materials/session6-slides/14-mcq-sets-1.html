<template data-slide-notes>
**Slide 14 — MCQ: sets (uniqueness)**

**Answer: A — `{1, 2, 3}`**

- The duplicate `2` collapses: `{1, 2, 2, 3}` is the same set as `{1, 2, 3}`.
- B would be true for a list, but a set never keeps duplicates.
- C is a list — wrong brackets.
- D is a tuple — wrong brackets.

Have the class run `print({1, 2, 2, 3})` themselves to see Python print `{1, 2, 3}`.

Say: "If you got this right, you understand the whole point of a set."

Arabic tip: اطلب من الطلاب قراءة السؤال بصوت عالٍ وترجمته: "ما نتيجة مجموعة فيها رقم مكرر؟" ثم أجب بالعربية: "المجموعة تحذف المكرر تلقائيًا."
