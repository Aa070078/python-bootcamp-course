<template data-slide-notes>
**Slide 15 — MCQ: sets (methods)**

**Answer: B — `fruits.discard("apple")`**

- A `remove()` raises a `KeyError` if the value is missing — NOT safe here.
- B `discard()` silently does nothing if missing — the safe choice. ✅
- C `delete()` is not a set method.
- D `pop()` removes and returns an *arbitrary* element — it takes no argument (removing by value isn't what pop does on sets).

Say: "Rule of thumb: if the value might not exist and you don't want to crash → `discard`. If you *want* to know it's missing (catch the error) → `remove`."

Arabic tip: لخّص القاعدة بالعربية: "إذا لم تتأكد من وجود القيمة، استخدم discard حتى لا يتعطل البرنامج."
