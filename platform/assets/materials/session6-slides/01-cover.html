<template data-slide-notes>
**Slide 1 — Cover**

Welcome the class warmly. Say: "Welcome back! Today we level up from lists. Lists store things in order — but **sets** and **dictionaries** are the secret weapons that make real Python powerful. We finish with a working Contact Manager project."

- Point at the glowing orb: "A set is a collection of unique things — no repeats. Like this core: one glowing heart, no copies."
- Give the 3-hour arc: review (10 min) → sets (60 min) → dictionaries (60 min) → project + wrap-up (40 min).
- Set expectations: they will write real code in the first 20 minutes.

Arabic tip: ابدأ بترحيب سريع واسأل: "كم مرة حذفتم التكرارات يدويًّا من قائمة؟" (How often have you removed duplicates by hand?) This primes the sets motivation.
