**Slide 3 — Review MCQ (Session 5: lists & tuples)**

**Answer: B — `(1, 2, 3)`** is the tuple.

- A `[1, 2, 3]` → a **list** (square brackets, mutable, ordered).
- C `{1, 2, 3}` → a **set** in Python 3 (curly braces) — a sneak peek of today's topic, or a dict.
- D `<1, 2, 3>` → not valid Python.

Explain the bracket memory trick: `[ ]` list, `( )` tuple, `{ }` set/dict.

Say: "This session is the *next chapter* — C is literally where we start today!"
