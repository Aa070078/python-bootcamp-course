<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Bootcamp - Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0e1a;color:#f8fafc;font-family:'Space Grotesk',system-ui,sans-serif}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px;height:52px;background:rgba(10,14,26,.97);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav .brand{font-family:'JetBrains Mono',monospace;font-size:13px;color:#22d3ee;letter-spacing:.12em;position:absolute;left:20px;font-weight:600}
.nav .brand em{font-style:normal;color:#64748b}
.nav button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#f8fafc;font-size:13px;padding:5px 16px;border-radius:6px;cursor:pointer;transition:all .12s;font-family:'Space Grotesk',sans-serif;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.2)}
.nav button:active{transform:scale(.97)}
.nav button:disabled{opacity:.2;cursor:default;transform:none}
.nav .counter{font-family:'JetBrains Mono',monospace;font-size:13px;color:#94a3b8;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.04);padding:4px 12px;border-radius:5px}
.nav .kbd{font-size:11px;color:#334155;position:absolute;right:20px}
.nav .kbd kbd{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:1px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px}
.frame-wrap{position:absolute;top:52px;left:0;right:0;bottom:48px;display:flex;align-items:flex-start;justify-content:center;background:#000;overflow:hidden}
.frame-wrap iframe{border:none;background:#0a0e1a;transform-origin:top center;display:block;flex-shrink:0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;background:rgba(10,14,26,.97);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08)}
.bottom .progress-wrap{flex:1;max-width:500px;margin:0 auto}
.bottom .progress-track{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;cursor:pointer;position:relative}
.bottom .progress-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#a3e635);border-radius:2px;transition:width .2s}
.bottom .progress-track:hover{height:5px}
.bottom .notes-toggle{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;font-size:12px;padding:4px 12px;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .12s}
.bottom .notes-toggle:hover{color:#f8fafc;background:rgba(255,255,255,.1)}
.bottom .notes-toggle.active{color:#22d3ee;border-color:#22d3ee}
.index-btn{position:fixed;bottom:56px;right:20px;z-index:1002;width:42px;height:42px;border-radius:50%;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.3);color:#22d3ee;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.index-btn:hover{background:rgba(34,211,238,.25);transform:scale(1.1)}
.index-panel{position:fixed;top:52px;right:0;bottom:48px;width:320px;background:rgba(10,14,26,.98);border-left:1px solid rgba(255,255,255,.1);z-index:1001;overflow-y:auto;padding:16px 12px;transform:translateX(100%);transition:transform .2s ease;backdrop-filter:blur(20px)}
.index-panel.open{transform:translateX(0)}
.index-panel .idx-title{font-family:'JetBrains Mono',monospace;font-size:12px;color:#64748b;letter-spacing:.15em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.index-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.index-item:hover{background:rgba(255,255,255,.06)}
.index-item.active{background:rgba(34,211,238,.1)}
.index-item .idx-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;min-width:26px;text-align:right}
.index-item.active .idx-num{color:#22d3ee}
.index-item .idx-name{font-size:13px;color:#cbd5e1}
.index-item.active .idx-name{color:#f8fafc}
.notes-panel{position:fixed;left:0;right:0;bottom:48px;height:200px;background:rgba(10,14,26,.98);border-top:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);z-index:1001;transform:translateY(100%);transition:transform .2s ease;padding:16px 24px;overflow-y:auto}
.notes-panel.open{transform:translateY(0)}
.notes-panel .notes-header{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;letter-spacing:.15em;margin-bottom:10px}
.notes-panel .notes-body{font-size:14px;color:#cbd5e1;line-height:1.7}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0e1a;z-index:2000;flex-direction:column;gap:12px}
.loading .spinner{width:32px;height:32px;border:3px solid rgba(34,211,238,.2);border-top-color:#22d3ee;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .text{font-family:'JetBrains Mono',monospace;font-size:13px;color:#22d3ee;letter-spacing:.1em}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div><div class="text">Loading slides...</div></div>
<div class="nav">
  <span class="brand" id="brand">PY <em>_BOOTCAMP</em></span>
  <button id="prevBtn" onclick="go(-1)">&#9664; Prev</button>
  <span class="counter" id="counter"></span>
  <button id="nextBtn" onclick="go(1)">Next &#9654;</button>
  <span class="kbd"><kbd>&#8592;</kbd> <kbd>&#8594;</kbd> nav &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>G</kbd> grid</span>
</div>
<div class="frame-wrap" id="wrap"><iframe id="frame" src="" allowfullscreen></iframe></div>
<div class="bottom">
  <button class="notes-toggle" id="notesBtn" onclick="toggleNotes()">Notes</button>
  <div class="progress-wrap"><div class="progress-track" id="progressTrack" onclick="seek(event)"><div class="progress-fill" id="progressFill"></div></div></div>
  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#334155" id="sectionLabel"></span>
</div>
<button class="index-btn" id="indexBtn" onclick="toggleIndex()" title="Slide index">&#9776;</button>
<div class="index-panel" id="indexPanel"></div>
<div class="notes-panel" id="notesPanel"><div class="notes-header">// INSTRUCTOR SCRIPT</div><div class="notes-body" id="notesBody"></div></div>
<script>
const params=new URLSearchParams(window.location.search);
const SESSION_NUM=parseInt(params.get('num'))||1;
const SLIDES_DIR='session'+SESSION_NUM+'-slides/';
let SLIDES=[],cur=0,total=0;
const SLIDE_W=1920,SLIDE_H=1080;
const frame=document.getElementById('frame'),counter=document.getElementById('counter'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),wrap=document.getElementById('wrap'),progressFill=document.getElementById('progressFill'),sectionLabel=document.getElementById('sectionLabel'),indexPanel=document.getElementById('indexPanel'),notesPanel=document.getElementById('notesPanel'),notesBody=document.getElementById('notesBody'),loading=document.getElementById('loading'),brand=document.getElementById('brand');
brand.innerHTML='PY <em>_BOOTCAMP</em> // S'+String(SESSION_NUM).padStart(2,'0');
document.title='Python Bootcamp - Session '+SESSION_NUM;
async function init(){try{const r=await fetch(SLIDES_DIR+'manifest.json');if(!r.ok)throw new Error('Manifest not found');const d=await r.json();if(Array.isArray(d)){SLIDES=d.map(i=>({f:i.file,n:i.title||i.file.replace('.html',''),s:i.section||''}))}else if(d.playlist){SLIDES=d.playlist.map(f=>({f:f,n:f.replace('.html','').replace(/^\d+-/,'').replace(/-/g,' '),s:''}))}if(!SLIDES.length){loading.innerHTML='<div class="text" style="color:#f87171">No slides found for Session '+SESSION_NUM+'</div>';return}total=SLIDES.length;buildIndex();loadSlide(0);loading.classList.add('hidden')}catch(e){loading.innerHTML='<div class="text" style="color:#f87171">Failed to load Session '+SESSION_NUM+'<br><small>'+e.message+'</small></div>'}}
function loadSlide(){frame.src=SLIDES_DIR+SLIDES[cur].f;counter.textContent=(cur+1)+' / '+total;prevBtn.disabled=cur===0;nextBtn.disabled=cur===total-1;progressFill.style.width=((cur/(total-1))*100)+'%';sectionLabel.textContent=SLIDES[cur].s||'';updateIndex();loadNotes()}
function scaleFrame(){const ww=wrap.clientWidth,wh=wrap.clientHeight;const s=Math.min(ww/SLIDE_W,wh/SLIDE_H,1);frame.style.width=SLIDE_W+'px';frame.style.height=SLIDE_H+'px';frame.style.transform='scale('+s+')'}
function go(d){const n=cur+d;if(n<0||n>=total)return;cur=n;loadSlide()}
function seek(e){const r=e.currentTarget.getBoundingClientRect();cur=Math.round(((e.clientX-r.left)/r.width)*(total-1));loadSlide()}
function toggleNotes(){notesPanel.classList.toggle('open');document.getElementById('notesBtn').classList.toggle('active')}
function toggleIndex(){indexPanel.classList.toggle('open')}
function loadNotes(){try{fetch(SLIDES_DIR+SLIDES[cur].f).then(r=>r.text()).then(html=>{const m=html.match(/<template data-slide-notes>([\s\S]*?)<\/template>/i);if(m){notesBody.innerHTML='<div style="white-space:pre-wrap">'+m[1].trim().replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</div>'}else{notesBody.innerHTML='<em style="color:#475569">No notes for this slide.</em>'}})}catch(e){notesBody.innerHTML=''}}
function buildIndex(){let h='<div class="idx-title">SLIDE INDEX ('+total+')</div>';SLIDES.forEach((sl,i)=>{h+='<div class="index-item'+(i===cur?' active':'')+'" onclick="jumpTo('+i+')"><span class="idx-num">'+(i+1)+'</span><span class="idx-name">'+sl.n+'</span></div>'});indexPanel.innerHTML=h}
function updateIndex(){indexPanel.querySelectorAll('.index-item').forEach((el,i)=>el.classList.toggle('active',i===cur));const a=indexPanel.querySelector('.index-item.active');if(a)a.scrollIntoView({block:'nearest',behavior:'smooth'})}
function jumpTo(i){cur=i;loadSlide()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='Home'){cur=0;loadSlide()}if(e.key==='End'){cur=total-1;loadSlide()}if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}if(e.key==='g'||e.key==='G')toggleIndex();if(e.key==='Escape'){indexPanel.classList.remove('open');notesPanel.classList.remove('open');document.getElementById('notesBtn').classList.remove('active')}});
let touchX=0;frame.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX});frame.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>50)go(dx<0?1:-1)});
frame.onload=scaleFrame;window.addEventListener('resize',scaleFrame);init();
</script>
</body>
</html>
