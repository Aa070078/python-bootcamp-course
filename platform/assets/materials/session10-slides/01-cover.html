<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide-container">
  <div class="bg-grid"></div>
  <div class="bg-glow-cyan" style="top:-200px; left:-100px;"></div>
  <div class="bg-glow-magenta" style="top:280px; right:-250px;"></div>

  <div class="chrome-topbar">
    <span class="chrome-dot"></span>
    <span>PYTHON BOOTCAMP // LIVE</span>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:150px; width:1760px; z-index:10;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:24px; color:var(--neon-cyan); letter-spacing:0.25em; text-transform:uppercase;">// SESSION 10 — 3 HOURS</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:120px; font-weight:700; color:var(--text-hi); margin-top:20px; line-height:1.02;">
      GIT <span style="color:var(--neon-cyan);">&</span> GITHUB
    </div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:44px; color:var(--neon-lime); margin-top:16px; font-weight:600;">Professional version control for your Python projects</div>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; right:180px; top:180px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(236,72,153,0.45) 0%, rgba(34,211,238,0.15) 45%, transparent 70%); border:1px solid rgba(34,211,238,0.4); z-index:5;"></div>
  <div data-object="true" data-object-type="shape" style="position:absolute; right:320px; top:320px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, rgba(163,230,53,0.5) 0%, transparent 70%); z-index:5;"></div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:560px; width:1760px; z-index:10;">
    <span class="chip chip-cyan">🐍 Python Bootcamp</span>
    <span class="chip chip-lime">⚡ 100% Hands-on</span>
    <span class="chip chip-magenta">💻 Terminal Time</span>
    <span class="chip chip-yellow">🚀 Ship to GitHub</span>
    <div class="arabic" style="font-family:'Cairo',sans-serif; font-size:34px; color:var(--text-lo); direction:rtl; margin-top:36px;">أهلاً بك في الجلسة العاشرة — Git و GitHub</div>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S10</div>
  <div class="chrome-pagenum">01 / 50</div>
</div>
<template data-slide-notes>
**Slide 1 — Cover (2 min)**
- Welcome students warmly. Today they graduate from "code that only lives on one laptop" to "code the world can see."
- Say: "By the end of today, every one of you will have a live project on GitHub. That is your coding CV."
- Set expectations: this is the most hands-on session yet — we will type commands, a LOT.
- Arabic tip: اطمئن الطلاب أنه لا يوجد حفظ خاطئ بعد اليوم — Git سيتولى الحفظ عنهم.
- Emphasise: session is 3 hours, keep energy high, follow along.
</template>
</body>
</html>
