<template data-slide-notes>
**Big concept incoming.** Slow down here.

Analogy: "متغير = علبة عليها اسم. جواها حاجة."

Physical demo (if possible): grab a box, write "name" on it, put a paper "Yousef" inside. Grab another box, write "age", put "17".

Now — the syntax reveal:
```
name = "Yousef"
```

Read this ARABIC-STYLE (right-to-left logic): "خد الكلمة Yousef، حطها في علبة اسمها name."

**CRITICAL misconception to fix now**: The `=` sign in Python is NOT the equals sign from math!
- Math: `x = 5` means "x يساوي 5" (a statement of truth)
- Python: `x = 5` means "حط 5 في علبة اسمها x" (a command)

Prove it: `x = 5` then `x = 10`. In math, x can't be 5 AND 10. In Python, we just replaced what's in the box.

Use variables live:
```
name = "Yousef"
print(name)     # → Yousef (no quotes because we want what's INSIDE the box)
print("name")   # → name  (WITH quotes = literal text)
```

That's the "aha!" moment. Wait for hands to shoot up when they get it.
