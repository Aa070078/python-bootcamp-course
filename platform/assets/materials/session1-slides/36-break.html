  <div class="bg-glow-cyan" data-object="true" data-object-type="shape" style="position:absolute; left:-200px; top:-200px; z-index:1;"></div>
  <div class="bg-glow-magenta" data-object="true" data-object-type="shape" style="position:absolute; right:-200px; bottom:-200px; left:1220px; top:600px; z-index:1;"></div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:340px; width:1760px; z-index:10; text-align:center;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:32px; color:#a78bfa; letter-spacing:0.3em; margin-bottom:32px;">// 15 MINUTE BREAK</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:280px; font-weight:700; color:#f8fafc; line-height:0.95; letter-spacing:-0.03em;">☕</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:72px; font-weight:700; color:#f8fafc; margin-top:24px;">Take a breath.</div>
    <div class="arabic" style="font-family:'Cairo',sans-serif; font-size:44px; color:#a78bfa; direction:rtl; margin-top:24px; font-weight:600;">استراحة — 15 دقيقة</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:30px; color:#94a3b8; margin-top:40px;">Water · stretch · check your notes · <span style="color:#a3e635;">back at 03:45</span></div>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S01</div>
  <div class="chrome-pagenum">36 / 47</div>
</div>

<template data-slide-notes>
Announce the break clearly with a specific return time. Write it on the board so no one forgets.

"استراحة 15 دقيقة. نرجع الساعة [SET TIME]. الجزء القادم = الميني بروجيكت والامتحان الحقيقي."

During the break:
- Circulate. Chat with students informally.
- Identify the 1-2 students who are struggling. Sit with them briefly, help them catch up.
- Have snacks/water available if possible.
- Don't leave the classroom — stay approachable.

Return sharply on time. If students are late, don't restart — they'll learn to be punctual.
</template>
