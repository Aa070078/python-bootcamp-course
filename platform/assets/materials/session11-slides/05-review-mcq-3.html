  <div class="chrome-brand">PY_BOOTCAMP // S11</div>
  <div class="chrome-pagenum">05 / 50</div>

<template data-slide-notes>
**Answer: A — `git pull`.** `pull` downloads remote changes (fetch) and merges them into your branch. `push` is the opposite direction.

- Memory hook: **push = upload, pull = download.**
- `git log --oneline` only *reads* history — it never changes your files.
- Warn them: pull before you start working each day to avoid merge conflicts.
- Arabic tip: «الدفع» push و«السحب» pull — تذكّر: الدفع يرسل، والسحب يستلم.
- Transition to today: "Git is your safety net for the Library homework. Now — objects."
</template>
