  <div class="chrome-brand">PY_BOOTCAMP // S11</div>
  <div class="chrome-pagenum">03 / 50</div>

<template data-slide-notes>
**Answer: B — `git add main.py`.** `add` puts changes into the staging area; `commit` snapshots them; `push` uploads; `status` only shows state.

- Recap the pipeline on the board: **working dir → `git add` → staging → `git commit` → local → `git push` → remote**.
- Common confusion: students try to `commit` directly. Remind them: commit only commits *staged* changes.
- Tip: `git add .` stages everything; `git add main.py` stages one file.
- Arabic tip: «المرحلة» = staging area — like a shopping cart before checkout.
- Move on: "You remember Git — we'll use it in homework to ship the Library project."
