<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide-container">
  <div class="bg-grid"></div>
  <div class="bg-glow-cyan"></div>
  <div class="bg-glow-lime"></div>

  <div class="chrome-topbar"><span class="chrome-dot"></span> INHERITANCE // CHECK</div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:140px; width:1760px; z-index:10;">
    <div class="kicker">QUICK CHECK #6</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:64px; font-weight:700; color:var(--text-hi); margin-top:14px;">Which line makes <span class="mono">Dog</span> inherit<br>from <span class="mono">Animal</span>?</div>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:500px; width:850px; height:150px; background:rgba(34,211,238,0.05); border:1px solid rgba(34,211,238,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:110px; top:535px; width:790px; z-index:10;">
    <span class="chip chip-lime" style="margin-right:16px;">A</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">class Dog(Animal):</span>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:990px; top:500px; width:850px; height:150px; background:rgba(34,211,238,0.05); border:1px solid rgba(34,211,238,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1020px; top:535px; width:790px; z-index:10;">
    <span class="chip chip-cyan" style="margin-right:16px;">B</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">import Animal</span>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:690px; width:850px; height:150px; background:rgba(34,211,238,0.05); border:1px solid rgba(34,211,238,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:110px; top:725px; width:790px; z-index:10;">
    <span class="chip chip-cyan" style="margin-right:16px;">C</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">dog = Animal()</span>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:990px; top:690px; width:850px; height:150px; background:rgba(34,211,238,0.05); border:1px solid rgba(34,211,238,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1020px; top:725px; width:790px; z-index:10;">
    <span class="chip chip-cyan" style="margin-right:16px;">D</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">def Dog(Animal):</span>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:900px; width:1760px; z-index:10;">
    <div class="arabic" style="font-family:'Cairo',sans-serif; font-size:30px; color:var(--text-lo); direction:rtl;">أي سطر يجعل الصنف Dog يرث من Animal؟</div>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S11</div>
  <div class="chrome-pagenum">22 / 50</div>
</div>
<template data-slide-notes>
**Answer: A — `class Dog(Animal):`.** The parent class goes in parentheses after the child's name.

- B is wrong (that's for importing modules), C creates an *instance* (not a subclass), D is invalid syntax (def makes functions).
- Point at the diagram from the previous slide: the `(Animal)` is the arrow pointing up to the parent.
- Drill the phrasing: "Dog IS-A Animal" → name in parens.
- Arabic tip: «الصنف الابن يكتب اسم الأب بين قوسين» — child class writes the parent's name in parens.
- Quick oral drill: "How would you make `SavingsAccount` inherit from `Account`?" → `class SavingsAccount(Account):`.
</template>
</body>
</html>
