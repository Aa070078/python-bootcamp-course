  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:96px; width:1500px; z-index:10;">
    <div class="kicker">PYTHON BOOTCAMP</div>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:200px; width:1500px; z-index:10;">
    <div style="font-family:'Space Grotesk',sans-serif; font-size:104px; font-weight:700; color:var(--text-hi); letter-spacing:-0.02em;">OBJECT-ORIENTED</div>

    <span class="chip chip-magenta">🤖 OOP</span>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S11</div>
  <div class="chrome-pagenum">01 / 50</div>

<template data-slide-notes>
**Welcome / hook (2 min):** "Up until now you've been writing *scripts* — today you learn to build *software*. Everything that matters in Python — pandas, Django, pygame — is built from classes."

- Say the arc out loud: 3 hours = ~1h theory, ~1h live project (PyBank), ~1h practice + quiz.
- Big energy moment: this is the session where they "level up" from functions to objects.
- Arabic tip: the term is «البرمجة الشيئية» (or الكائنية); tell them to remember "صنف/كائن" = class/object — we will use them constantly.
- Optional: poll the room — who has heard of OOP before? Who has ever used `class`?
</template>
