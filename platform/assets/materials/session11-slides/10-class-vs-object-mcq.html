<template data-slide-notes>
**Answer: B — class / object.**

- `class Dog:` is the blueprint (the cutter). `rex = Dog()` calls the class to build an actual instance in memory.
- Reinforce: `Dog()` is a *constructor call* — it looks like calling a function, but it builds an object.
- Quick follow-up question for the room: "If I make 3 dogs, how many objects exist? How many classes?" → 3 objects, 1 class.
- Arabic tip: «الصنف واحد، والكائنات كثيرة» = one class, many objects.
- If many students miss it, re-run the cookie analogy before continuing.
