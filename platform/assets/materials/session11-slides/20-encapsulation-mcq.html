<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide-container">
  <div class="bg-grid"></div>
  <div class="bg-glow-lime"></div>
  <div class="bg-glow-magenta"></div>

  <div class="chrome-topbar"><span class="chrome-dot"></span> ENCAPSULATION // CHECK</div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:140px; width:1760px; z-index:10;">
    <div class="kicker">QUICK CHECK #5</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:64px; font-weight:700; color:var(--text-hi); margin-top:14px;">What's the SAFE way to change an<br>account's balance in our class?</div>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:500px; width:850px; height:150px; background:rgba(163,230,53,0.05); border:1px solid rgba(163,230,53,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:110px; top:535px; width:790px; z-index:10;">
    <span class="chip chip-cyan" style="margin-right:16px;">A</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">acc.balance = -50</span>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:990px; top:500px; width:850px; height:150px; background:rgba(163,230,53,0.05); border:1px solid rgba(163,230,53,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1020px; top:535px; width:790px; z-index:10;">
    <span class="chip chip-lime" style="margin-right:16px;">B</span><span style="font-family:'Space Grotesk',sans-serif; font-size:32px; color:var(--text-mid);">use the setter / a method that validates</span>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:690px; width:850px; height:150px; background:rgba(163,230,53,0.05); border:1px solid rgba(163,230,53,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:110px; top:725px; width:790px; z-index:10;">
    <span class="chip chip-cyan" style="margin-right:16px;">C</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">acc.delete()</span>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:990px; top:690px; width:850px; height:150px; background:rgba(163,230,53,0.05); border:1px solid rgba(163,230,53,0.3); border-radius:18px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1020px; top:725px; width:790px; z-index:10;">
    <span class="chip chip-cyan" style="margin-right:16px;">D</span><span style="font-family:'JetBrains Mono',monospace; font-size:30px; color:var(--text-mid);">print(acc._balance)</span>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:900px; width:1760px; z-index:10;">
    <div class="arabic" style="font-family:'Cairo',sans-serif; font-size:30px; color:var(--text-lo); direction:rtl;">ما الطريقة الآمنة لتغيير رصيد حساب داخل الصنف؟</div>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S11</div>
  <div class="chrome-pagenum">20 / 50</div>
</div>
<template data-slide-notes>
**Answer: B — go through the setter / a validating method.**

- A is unsafe: direct assignment skips validation (negative balance becomes possible).
- D is just *reading* (and touching internals) — not changing.
- Recap the "ATM" idea: the buttons (methods/setters) are the safe interface; the vault (internals) stays hidden.
- Ask a follow-up: "What should `withdraw` do if amount > balance?" → reject/return False (we'll see this pattern in the project).
- Arabic tip: «غيّر من خلال الدالة لا مباشرة» — change via methods, not directly.
- Transition to the second big principle: inheritance.
</template>
</body>
</html>
