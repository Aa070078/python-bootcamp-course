<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide-container">
  <div class="bg-grid"></div>
  <div class="bg-glow-cyan" style="top:-200px; right:-160px;"></div>
  <div class="bg-glow-magenta" style="bottom:-180px; left:-120px;"></div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:110px; width:1700px; z-index:10;">
    <div class="kicker">🧠 REVIEW — FUNCTIONS</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:80px; font-weight:700; color:var(--text-hi); margin-top:10px;">Q3 · Predict the output</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:38px; color:var(--text-mid); margin-top:14px;">What does this print?</div>
  </div>

  <div class="code-window" data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:340px; width:980px; height:340px; z-index:5;">
    <div class="code-window-header">
      <span class="code-dot code-dot-r"></span>
      <span class="code-dot code-dot-y"></span>
      <span class="code-dot code-dot-g"></span>
      <span class="code-window-title">predict.py</span>
    </div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:110px; top:410px; width:920px; z-index:10; font-family:'JetBrains Mono',monospace; font-size:30px; line-height:1.6;">
    <div><span class="tok-kw">def</span> <span class="tok-fn">add</span>(<span class="tok-var">a</span>, <span class="tok-var">b</span>=<span class="tok-num">5</span>):</div>
    <div>&nbsp;&nbsp;&nbsp;&nbsp;<span class="tok-kw">return</span> <span class="tok-var">a</span> <span class="tok-op">+</span> <span class="tok-var">b</span></div>
    <div>&nbsp;</div>
    <div><span class="tok-fn">print</span>(<span class="tok-fn">add</span>(<span class="tok-num">3</span>))</div>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:1120px; top:340px; width:660px; height:150px; background:rgba(34,211,238,0.06); border:1px solid rgba(34,211,238,0.35); border-radius:20px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1160px; top:382px; width:580px; z-index:10;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--text-hi);"><span class="chip chip-cyan">A</span> &nbsp;<span class="tok-num">8</span></div>
  </div>

  <div data-object="true" data-object-type="shape" style="position:absolute; left:1120px; top:530px; width:660px; height:150px; background:rgba(236,72,153,0.06); border:1px solid rgba(236,72,153,0.35); border-radius:20px; z-index:5;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1160px; top:572px; width:580px; z-index:10;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--text-hi);"><span class="chip chip-magenta">B</span> &nbsp;<span class="tok-num">5</span></div>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1120px; top:720px; width:660px; z-index:10;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--text-lo);"><span class="chip chip-yellow">C</span> &nbsp;TypeError &nbsp;&nbsp;<span class="chip chip-violet">D</span> &nbsp;<span class="tok-str">"35"</span></div>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:760px; width:980px; z-index:10;">
    <div style="font-family:'Space Grotesk',sans-serif; font-size:40px; color:var(--neon-lime);">✔ Answer: <b>A — <span class="tok-num">8</span></b> &nbsp;(3 + default 5)</div>
    <div class="arabic" style="font-family:'Cairo',sans-serif; font-size:30px; color:var(--text-lo); direction:rtl; margin-top:14px;">سؤال مراجعة: توقّع ناتج الدالة add(3) — الإجابة: 8</div>
  </div>

  <div class="chrome-brand">PY_BOOTCAMP // S08</div>
  <div class="chrome-pagenum">05 / 50</div>
</div>
<template data-slide-notes>
**Review MCQ 3 — 2 min.**

`add(3)` uses the default `b=5`, so `3 + 5 = 8`.

- Common mistake: students answer `35` thinking string concatenation — but both are ints, so it's arithmetic.
- Reinforce default parameter idea: it kicks in when the argument is missing.
- Arabic tip: «المُعامل الافتراضي يُستخدَم إذا لم تُمرَّر قيمة».
</template>
