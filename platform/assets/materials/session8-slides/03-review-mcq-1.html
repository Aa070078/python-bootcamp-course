<template data-slide-notes>
**Review MCQ 1 — 2 min.**

`def greet(name): print("hi")` → calling `x = greet("Nour")` → `x is None`.

- Common mistake: students think a function that only prints returns nothing special, but Python *always* returns something — the default is `None`.
- Quick rule: no `return` → `None`.
- Arabic tip: «الوظيفة بلا return تُرجع None» — say it twice, students repeat.
