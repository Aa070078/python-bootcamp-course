<template data-slide-notes>
**Review MCQ 2 — 2 min.**

`return` is the only way a function hands a value back to its caller (print only displays it).

- Clarify the classic trap: `print` shows text, `return` gives a value you can store in a variable. `yield` is for generators — not needed yet.
- Follow-up: `result = add(2,3)` → `result` holds `5` because `add` used `return`.
- Arabic tip: «return يُرجِع القيمة، print يَعرض فقط».
