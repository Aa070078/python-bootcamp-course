<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../theme.css">
<style></style>
</head>
<body>
<div class="slide-container">
<div class="bg-grid"></div>
<div class="bg-glow-cyan"></div>
<div class="chrome-topbar"><span class="chrome-dot"></span>TUPLES</div>

<div class="kicker" style="position:absolute;top:100px;left:80px;">PREDICT THE OUTPUT</div>
<div class="arabic" style="position:absolute;top:140px;left:80px;font-size:24px;color:var(--text-lo););font-size:24px;color:var(--text-lo);">توقّع الناتج</div>
<div style="position:absolute;top:200px;left:80px;"><div class="code-window" style="width:880px;">
<div class="code-window-header">
<div class="code-dot code-dot-r"></div><div class="code-dot code-dot-y"></div><div class="code-dot code-dot-g"></div>
<span class="code-window-title">predict.py</span>
</div>
<pre style="padding:24px 28px;margin:0;font-size:20px;line-height:1.55;color:var(--text-hi);overflow:hidden;"><span class="tok-var">letters</span> = [<span class="tok-str">"A"</span>, <span class="tok-str">"B"</span>, <span class="tok-str">"C"</span>]
<span class="tok-var">nums</span> = [<span class="tok-num">1</span>, <span class="tok-num">2</span>, <span class="tok-num">3</span>]

<span class="tok-kw">for</span> <span class="tok-var">ch</span>, <span class="tok-var">n</span> <span class="tok-kw">in</span> <span class="tok-fn">zip</span>(<span class="tok-var">letters</span>, <span class="tok-var">nums</span>):
    <span class="tok-fn">print</span>(<span class="tok-var">ch</span>, <span class="tok-var">n</span>)</span></pre>
</div></div>
<div style="position:absolute;top:200px;right:80px;width:800px;display:flex;flex-direction:column;gap:14px;">
  <div style="padding:16px 20px;border-radius:12px;background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.15);">
    <div style="font-size:18px;color:var(--neon-yellow);font-weight:600;margin-bottom:6px;">Hint 1</div>
    <div style="font-size:18px;color:var(--text-mid);">zip pairs position by position</div>
  </div>
  <div style="padding:16px 20px;border-radius:12px;background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.15);">
    <div style="font-size:18px;color:var(--neon-yellow);font-weight:600;margin-bottom:6px;">Hint 2</div>
    <div style="font-size:18px;color:var(--text-mid);">It stops at the shortest list</div>
  </div>
</div>
<div style="position:absolute;bottom:100px;left:80px;max-width:1760px;padding:20px 28px;border-radius:12px;background:rgba(163,230,53,0.07);border:1px solid rgba(163,230,53,0.2);"><span style="font-size:24px;color:var(--neon-lime);font-weight:700;">Answers:&nbsp;&nbsp;<span style="font-family:JetBrains Mono,monospace;color:var(--text-hi);">A 1&nbsp;&nbsp;B 2&nbsp;&nbsp;C 3</span></span></div>

<div class="chrome-brand">PY_BOOTCAMP // S05</div>
<div class="chrome-pagenum">52 / 63</div>
<template data-slide-notes>Predict zip output: A 1, B 2, C 3. zip stops at the shortest list.</template>
</div>
</body>
</html>
