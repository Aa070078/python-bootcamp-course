<template data-slide-notes>
Welcome to Session 13! Today we flip a switch: your Python programs stop living in a bubble and start talking to the whole Internet.

Agenda of the slide: pure hype + roadmapping. Tell them: "By the end of today, each of you will write Python code that asks a real weather server a question — and gets a real answer back."

Key motivational framing for ages 15–22: this is the session where code becomes *useful* — the same technique powers phone weather apps, price trackers, Discord bots, and ChatGPT's plugin layer.

Arabic tip: وضّح أن "API" اختصار لـ Application Programming Interface أي "واجهة برمجة التطبيقات"، وهي مجرد وسيلة منظمة لبرنامجين يتحدثان مع بعض.

Common misconception to pre-empt: an API is NOT a website. It is the *messaging channel* a program uses. Websites are for humans; APIs are for programs.
