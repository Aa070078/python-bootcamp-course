<template data-slide-notes>
Answer: B. `requests.get()` returns a `requests.Response` object. You read `.status_code`, `.text`, `.json()`, `.headers`.

Why we ask: today we call `.text` and hand it to BeautifulSoup — the same Response object is the bridge between "talking to APIs" (session 13) and "reading web pages" (today).

Ask: "What would `resp.json()` be useful for?" → API endpoints returning JSON.

Arabic tip: ذكّرهم أن الاستجابة Response = الطلب + النص + الحالة. اربط المعلومة القديمة بالجديدة.
