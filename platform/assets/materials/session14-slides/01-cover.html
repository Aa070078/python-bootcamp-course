<template data-slide-notes>
Welcome to Session 14! Today we turn the whole internet into a data source.

Say: "Last session you talked to APIs. Today we talk to the web itself — no API key needed. We learn how websites are built, how to fetch them, and how to pull out the data you want, legally and politely."

Run the plan on the board: requests → BeautifulSoup → extract → clean → save → automate. Mention this is a 3-hour live session, ends with a mini project + homework.

Arabic tip: كشط الويب (web scraping) — explain the word "كشط/استخراج" and that مسؤول = responsible. Keep it motivational: "you already know Python; today we make it walk the web."
